name: Brandle standalone verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m unittest scripts/test_scan_git_history.py
      - run: python3 scripts/scan-git-history.py
      - run: node --check app.mjs && node --check logic.mjs && node --check build-worker.mjs
      - run: node --test scripts/compare-release-baseline.test.mjs
      - run: node --test release-guard.test.mjs
      - run: node --test tests.mjs
      - run: node build-worker.mjs
      - run: node --check dist/worker.mjs
      - run: node --test worker.test.mjs
# CI ONLY: production Brandle Worker remains deployed from the original repository
# until the new repository, credentials, release and rollback have been verified.
