name: Import preserved Brandle source history

# One-time, non-deploying bootstrap. Imports only the existing public game.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-source-history.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: brandle-source-history-import
  cancel-in-progress: false

jobs:
  prepare-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Brandle destination
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch original public source and history
        uses: actions/checkout@v4
        with:
          repository: anevum/anevum-web
          ref: c81c42683cd397bebb8855f07dd56393a56e124b
          path: .upstream-source
          fetch-depth: 0
          persist-credentials: false

      - name: Split original Git history and verify game
        shell: bash
        run: |
          set -euo pipefail
          test -f .upstream-source/games/brandle/LICENSE
          test -f .upstream-source/games/brandle/NOTICE.md
          test -f .upstream-source/games/brandle/.github/workflows/ci.yml
          split_sha="$(git -C .upstream-source subtree split --prefix=games/brandle HEAD)"
          test -n "$split_sha"
          git fetch .upstream-source "$split_sha"
          git worktree add --detach "$RUNNER_TEMP/brandle-source-check" "$split_sha"
          cd "$RUNNER_TEMP/brandle-source-check"
          test -f LICENSE && test -f NOTICE.md
          test -f README.md && test -f .github/workflows/ci.yml
          test ! -e apps && test ! -e games
          node --check app.mjs
          node --check logic.mjs
          node --test tests.mjs
          node build-worker.mjs
          node --check dist/worker.mjs
          echo "BRANDLE source and tests verified: $split_sha"

      - name: Prepare branch with preserved game history and unchanged workflows
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin refs/heads/migration/brandle-source >/dev/null 2>&1; then
            echo "::error::Migration branch already exists; refusing to overwrite"
            exit 1
          fi
          main_sha="$(git rev-parse refs/heads/main)"
          # The previous step checked out the original isolated project history.
          source_sha="$(git -C "$RUNNER_TEMP/brandle-source-check" rev-parse HEAD)"
          test -n "$main_sha" && test -n "$source_sha"

          # GitHub Actions' token may write code, but cannot push commits that
          # introduce workflow files. Exclude only historical workflow entries,
          # retaining the original project commit messages and parent lineage.
          # The source of record and exact history remain in anevum-web.
          git init --initial-branch=main "$RUNNER_TEMP/brandle-history-safe"
          git -C "$RUNNER_TEMP/brandle-history-safe" fetch "$GITHUB_WORKSPACE" "$source_sha"
          git -C "$RUNNER_TEMP/brandle-history-safe" reset --hard FETCH_HEAD
          FILTER_BRANCH_SQUELCH_WARNING=1 git -C "$RUNNER_TEMP/brandle-history-safe" \
            filter-branch --force --index-filter \
            'git rm --cached -r -q --ignore-unmatch .github/workflows' \
            --prune-empty -- main
          filtered_sha="$(git -C "$RUNNER_TEMP/brandle-history-safe" rev-parse main)"
          if git -C "$RUNNER_TEMP/brandle-history-safe" rev-list --objects main |
               grep -Eq ' \.github/workflows/'; then
            echo "::error::Workflow file still reachable in migration history"
            exit 1
          fi

          git fetch "$RUNNER_TEMP/brandle-history-safe" "$filtered_sha"
          # Final tree combines Brandle's standalone source with the existing
          # bootstrap workflow, so the push changes NO workflow paths.
          git read-tree "$filtered_sha"
          git restore --source="$main_sha" --staged -- \
            .github/workflows/import-source-history.yml
          if test -n "$(git diff --cached --name-only "$main_sha" -- .github/workflows/)"; then
            echo "::error::Migration unexpectedly changes existing workflow paths"
            exit 1
          fi
          tree_sha="$(git write-tree)"
          merge_sha="$(printf '%s\n' \
            'Import Brandle standalone project source and commit history' \
            '' \
            'First parent: existing GitHub README and migration workflow.' \
            'Second parent: original Brandle project history with CI-only' \
            'workflow entries removed for GitHub Actions token restrictions.' \
            'Original, unmodified source remains in anevum/anevum-web.' \
            'CI will be installed separately after source review.' | \
            git -c user.name='ANEVUM Repository Migration' \
                -c user.email='devon@anevum.com' \
                commit-tree "$tree_sha" -p "$main_sha" -p "$filtered_sha")"
          git update-ref refs/heads/migration/brandle-source "$merge_sha"
          git push origin refs/heads/migration/brandle-source
          echo "Prepared scoped-history migration branch: $merge_sha"
          echo "Production and database settings are unchanged."
